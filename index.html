<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" data-next-head="" />
  <meta name="viewport" content="width=device-width" data-next-head="" />
  <title data-next-head="">Opsiland</title>
  <link rel="preload" href="./fonts/Raleway-ExtraBold.ttf" as="font" type="font/ttf" />
  <link rel="preload" href="./fonts/Roboto-Regular.ttf" as="font" type="font/ttf" />
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      padding: 32px 24px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @font-face {
      font-family: "Raleway";
      src: url("./fonts/Raleway-ExtraBold.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Roboto";
      src: url("./fonts/Roboto-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    h1 {
      margin: 0;
      font-size: 64px;
      text-align: center;
      font-family: "Raleway", sans-serif;
      font-style: normal;
      font-weight: 800;
    }

    footer {
      margin: 0;
      text-align: center;
      font-family: "Roboto", sans-serif;
      font-style: normal;
      font-weight: 400;
    }
  </style>
</head>

<body>
  <h1>Opsiland</h1>
  <footer>There is really nothing to see here.</footer>
</body>

</html>
